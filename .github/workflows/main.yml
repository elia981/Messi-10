name: Build Messi Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          rm -rf src
          mkdir -p src
          unzip -q messi-android-studio-v2-1.zip -d src
          find src -maxdepth 3 -type f | head -50

      - name: Make Gradle executable
        run: |
          GRADLEW=$(find src -name gradlew -type f | head -1)
          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
          fi

      - name: Build Debug APK
        run: |
          GRADLEW=$(find src -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew was not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messi-10-APK
          path: |
            src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
