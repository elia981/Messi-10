name: Build Messi Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unzip project
        run: |
          rm -rf src
          mkdir -p src
          unzip -q messi-android-studio-v2-1.zip -d src
          echo "Project contents:"
          find src/messi-android-studio -maxdepth 2 -type f

      - name: Build Debug APK
        working-directory: src/messi-android-studio
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messi-10-APK
          path: src/messi-android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
