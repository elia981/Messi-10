name: Build Messi Android from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to project ZIP in repo'
        required: true
        default: 'messi-android-studio-v2.zip'
      project_dir:
        description: 'Extracted project directory'
        required: true
        default: 'src/messi-android-studio'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unzip project
        run: |
          rm -rf src
          mkdir -p src
          unzip -q "${{ github.event.inputs.zip_path }}" -d src
          test -f "${{ github.event.inputs.project_dir }}/settings.gradle" || {
            echo "settings.gradle not found. Extracted tree:"
            find src -maxdepth 3 -type f | sort
            exit 1
          }

      - name: Make gradlew executable
        working-directory: ${{ github.event.inputs.project_dir }}
        run: chmod +x gradlew || true

      - name: Build debug APK
        working-directory: ${{ github.event.inputs.project_dir }}
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messi-debug-apk
          path: ${{ github.event.inputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release AAB
        working-directory: ${{ github.event.inputs.project_dir }}
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:bundleRelease --stacktrace
          else
            gradle :app:bundleRelease --stacktrace
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: messi-release-aab
          path: ${{ github.event.inputs.project_dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
